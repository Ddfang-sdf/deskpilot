[project]
name = "deskpilot"
version = "0.2.0"
description = "自定义的安全桌面驾驶舱——让 AI agent 自主、安全地操作 Windows 电脑"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "uiautomation>=2.0",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pyperclip>=1.8",
    "mcp>=1.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "rapidocr-onnxruntime>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
