[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpilot"
version = "0.3.2"
description = "自定义的安全桌面驾驶舱——让 AI agent 自主、安全地操作 Windows 电脑"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "uiautomation>=2.0",
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "pyperclip>=1.8",
    "mcp>=1.0,<2",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "rapidocr-onnxruntime>=1.2",
]

# 显式限定包发现范围：仓库根还有 audit/ assets/ release/ 等顶层目录,
# setuptools flat-layout 自动发现会报 Multiple top-level packages(ISS-0011 流水线实证)
[tool.setuptools.packages.find]
include = ["deskpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
