name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e . pyinstaller

      # ISS-0025 E：随机序(暴露顺序依赖)+真机集成显式开关;
      # 基准脚本(实开窗口长跑)不属 CI 常规套件
      # -x 快停于首个失败;输出落盘供无条件上传产物(自诊断管线)
      - name: Run tests (random order + integration)
        shell: pwsh
        run: |
          pip install pytest-randomly
          python -m pytest tests -q -x --tb=short --run-integration --ignore=tests/test_benchmark_iss8.py 2>&1 | Tee-Object -FilePath pytest-output.txt
          exit $LASTEXITCODE

      - name: Upload pytest output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

      - name: Build exe
        run: pyinstaller deskpilot.spec --noconfirm --clean

      - name: Package zip + sha256 + release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ github.ref_name }}'
          if ($ver -notmatch '^v\d+\.') { $ver = 'v0.0.0-dryrun' }
          $zip = "deskpilot-$ver-windows-x64.zip"
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item dist\deskpilot.exe, policy.yml staging\
          Compress-Archive staging\* $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii
          python scripts/render_release_notes.py --version $ver --sha256 $hash --changes-file release/CHANGES.md --output release-body.md
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      # ISS-0034 B6：守卫的真实调用点——产物策略必须与 repo 真源哈希一致,
      # 失败即红(verify_policy_sync 非零退出)
      - name: Verify policy sync
        shell: pwsh
        run: |
          python -c "from deskpilot.whitelist_admin import verify_policy_sync; import sys; sys.exit(0 if verify_policy_sync('policy.yml', 'staging/policy.yml') else 1)"

      - name: Upload build artifact (dry-run evidence)
        uses: actions/upload-artifact@v4
        with:
          name: deskpilot-build
          path: |
            deskpilot-*-windows-x64.zip
            deskpilot-*-windows-x64.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" "$env:ZIP.sha256" --title "DeskPilot ${{ github.ref_name }}" --notes-file release-body.md
