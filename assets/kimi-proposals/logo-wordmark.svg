<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="dp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .dp-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 72px; font-weight: 700; letter-spacing: -0.03em; }
      .dp-sub  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
      @media (prefers-color-scheme: dark) { .dp-text { fill: #f8fafc; } .dp-sub { fill: #64748b; } }
      @media (prefers-color-scheme: light) { .dp-text { fill: #0f172a; } .dp-sub { fill: #94a3b8; } }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(24, 22)">
    <!-- Outer window frame (safety rail metaphor) -->
    <rect x="0" y="0" width="96" height="96" rx="18" fill="none" stroke="url(#dp-grad)" stroke-width="3.5"/>
    <!-- Inner guard rail -->
    <rect x="7" y="7" width="82" height="82" rx="14" fill="none" stroke="url(#dp-grad)" stroke-width="1.5" opacity="0.5"/>
    <!-- Title bar -->
    <line x1="0" y1="28" x2="96" y2="28" stroke="url(#dp-grad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Window control dot -->
    <circle cx="20" cy="14" r="3.5" fill="#22d3ee"/>

    <!-- Letter D -->
    <path d="M 26 38 L 26 74 M 26 38 Q 46 38 46 56 Q 46 74 26 74" fill="none" stroke="url(#dp-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Letter P -->
    <path d="M 58 38 L 58 74 M 58 38 L 68 38 Q 76 38 76 46 L 76 54 Q 76 62 68 62 L 58 62" fill="none" stroke="url(#dp-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom safety rails -->
    <line x1="24" y1="84" x2="72" y2="84" stroke="url(#dp-grad)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="24" y1="90" x2="72" y2="90" stroke="url(#dp-grad)" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
  </g>

  <!-- Wordmark -->
  <text x="148" y="95" class="dp-text">DeskPilot</text>
  <text x="150" y="118" class="dp-sub">SECURE AI DESKTOP CONTROL</text>
</svg>